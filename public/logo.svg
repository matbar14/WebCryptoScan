<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a7f3d0"/>
      <stop offset="0.8" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>

  <!-- сканирующая рамка (уголки QR) -->
  <g fill="none" stroke="url(#em)" stroke-width="4" stroke-linecap="round">
    <path d="M24 11 H16 q-5 0 -5 5 v8"/>
    <path d="M40 11 h8 q5 0 5 5 v8"/>
    <path d="M11 40 v8 q0 5 5 5 h8"/>
    <path d="M53 40 v8 q0 5 -5 5 h-8"/>
  </g>

  <!-- модули QR по диагонали -->
  <rect x="45" y="14" width="4" height="4" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="15" y="45" width="4" height="4" rx="1" fill="#34d399" opacity="0.8"/>

  <!-- скан-луч -->
  <line x1="15" y1="32" x2="49" y2="32" stroke="url(#beam)" stroke-width="7" stroke-linecap="round" opacity="0.22"/>
  <line x1="15" y1="32" x2="49" y2="32" stroke="url(#beam)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ключ -->
  <g fill="none" stroke="#fafafa" stroke-width="4.5" stroke-linecap="round">
    <circle cx="25.5" cy="25.5" r="8"/>
    <line x1="31.5" y1="31.5" x2="46" y2="46"/>
    <path d="M41 41 L44.5 37.5"/>
  </g>
</svg>
